# Kinect start-up (sub_82288BD0): skip NuiInitialize, which needs XAM's Kinect
# service, and mark the input manager Kinect-ready so every event's start
# screen (hudinput.lua HUDInput:WAIT) stops waiting and takes controller input.
# Leaves through the function's own failure exit. Implemented in
# src/london_hooks.cpp.
[[entrypoint.midasm_hook]]
name = "LondonSkipKinectInit"
address = 0x82288BE0
registers = ["r26"]
jump_address = 0x82288C04

# D3D swap scheduling (sub_825BDD40): the swap token carries the present
# interval (bits 8-11); London uses 2 (30 fps at 60 Hz). Rewrite it to 1 so it
# presents every vblank (cvar london_60fps, default on). Implemented in
# src/london_hooks.cpp.
[[entrypoint.midasm_hook]]
name = "LondonSwapInterval"
address = 0x825BDD50
