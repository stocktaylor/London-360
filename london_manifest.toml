# CRT setjmp/longjmp (setjmp saves f14-f31, r13-r31, v64-v127, LR/CR into the
# buffer; longjmp reloads them and returns through the saved LR). Recompiled
# as-is, longjmp's blr just returns to its caller, so the error unwind of the
# decoder at sub_8241D5E0 (~30 longjmp sites around 0x8241xxxx) spun forever
# on the pulsing boot logo. Codegen replaces calls to these with host
# setjmp/longjmp keyed by the guest jmp_buf address.
